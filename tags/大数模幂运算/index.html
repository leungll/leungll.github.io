<!-- Copy Code Funciton -->
<script>
    document.addEventListener('DOMContentLoaded', (event) => {
        document.querySelectorAll('pre').forEach((pre) => {
            const button = document.createElement('button');
            button.innerText = 'Copy';
            button.className = 'copy-button';

            button.addEventListener('click', () => {
            const codeLines = pre.querySelectorAll('.hljs-ln-code');
            // 单行代码块不会生成行号表格，此时直接取 <code> 的文本
            const codeContent = codeLines.length
                ? Array.from(codeLines).map(line => line.textContent).join('\n')
                : (pre.querySelector('code') || pre).textContent;

            navigator.clipboard.writeText(codeContent).then(() => {
                button.innerText = '√ Copied!';
                setTimeout(() => {
                button.innerText = 'Copy';
                }, 3000);
            }).catch(err => {
                console.error('Copy failed: ', err);
                alert('Unable to copy code, please check browser permissions!');
            });
            });

            // 右上角工具栏：复制按钮（悬停显示）+ 语言标签
            const tools = document.createElement('div');
            tools.className = 'code-tools';
            tools.appendChild(button);
            if (pre.dataset.lang) {
                const tag = document.createElement('span');
                tag.className = 'code-lang';
                tag.innerText = pre.dataset.lang;
                tools.appendChild(tag);
            }
            pre.appendChild(tools);
        });
    });
</script>


<script src="/js/highlight.min.js"></script>


<script src="/js/highlightjs-line-numbers.js"></script>


<script>
    // 代码块右上角显示的语言名，没列出的直接显示大写
    const LANG_NAMES = {
        cpp: 'C++', 'c++': 'C++', c: 'C', java: 'Java', python: 'Python',
        javascript: 'JavaScript', js: 'JavaScript', typescript: 'TypeScript', ts: 'TypeScript',
        bash: 'Bash', shell: 'Shell', sh: 'Shell', powershell: 'PowerShell', cmd: 'CMD', bat: 'CMD',
        sql: 'SQL', cypher: 'Cypher', yaml: 'YAML', yml: 'YAML', json: 'JSON', ini: 'INI',
        html: 'HTML', xml: 'XML', css: 'CSS', markdown: 'Markdown', md: 'Markdown',
        text: 'Text', txt: 'Text', plaintext: 'Text'
    };

    document.querySelectorAll('pre > code').forEach((code) => {
        const match = code.className.match(/\blanguage-(\S+)/);
        let lang = match ? match[1].toLowerCase() : 'text';
        code.parentElement.dataset.lang = LANG_NAMES[lang] || lang.toUpperCase();

        // highlight.js 从 "language-c++" 只能解析出 "c"；不认识的语言（如 cypher）和没写语言的块按纯文本处理，避免自动识别乱上色
        if (lang === 'c++') lang = 'cpp';
        if (!hljs.getLanguage(lang)) lang = 'plaintext';
        code.className = 'language-' + lang;
    });

    hljs.highlightAll();
    hljs.initLineNumbersOnLoad();
</script>
