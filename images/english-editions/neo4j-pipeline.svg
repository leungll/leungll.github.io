<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 213" role="img" aria-labelledby="title desc"><title id="title">From a source snapshot to a queryable graph</title><desc id="desc">Source JSON is validated into CSV, then imported into Neo4j. Database checks compare the graph against the prepared rows.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b7289"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#27394a}.label{font-size:16px;font-weight:600}.note{font-size:13px;fill:#586d80}.edge{fill:none;stroke:#5b7289;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f4f8fc;stroke:#9db6ce;stroke-width:1.4}.good{fill:#f0faf5;stroke:#85b59c;stroke-width:1.4}</style><rect width="756" height="213" rx="12" fill="#fff"/><text x="28" y="34" class="label">Make each import boundary inspectable</text><rect x="28" y="65" width="216" height="78" rx="8" class="box"/><text x="136" y="96" text-anchor="middle" class="label">Source snapshot</text><text x="136" y="121" text-anchor="middle" class="note">Saved JSON + provenance</text><rect x="270" y="65" width="216" height="78" rx="8" class="box"/><text x="378" y="96" text-anchor="middle" class="label">Prepared rows</text><text x="378" y="121" text-anchor="middle" class="note">Validated IDs and edges</text><rect x="512" y="65" width="216" height="78" rx="8" class="box"/><text x="620" y="96" text-anchor="middle" class="label">Queryable graph</text><text x="620" y="121" text-anchor="middle" class="note">Constraints + MERGE</text><path class="edge" d="M 244 104 H 265"/><path class="edge" d="M 486 104 H 507"/><path class="edge" d="M 620 143 V 185 H 378 V 149"/><text x="500" y="177" text-anchor="middle" class="note">Compare counts, endpoints, and reruns</text></svg>