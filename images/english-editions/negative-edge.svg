<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 342" role="img" aria-labelledby="title desc"><title id="title">A negative edge invalidates Dijkstra finalization</title><desc id="desc">Directed edges A to B cost 1, A to C cost 4, and C to B cost minus 6. Stopping at B with cost 1 misses the cheaper path through C.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b7289"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#27394a}.label{font-size:16px;font-weight:600}.note{font-size:13px;fill:#586d80}.edge{fill:none;stroke:#5b7289;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f4f8fc;stroke:#9db6ce;stroke-width:1.4}.good{fill:#f0faf5;stroke:#85b59c;stroke-width:1.4}</style><rect width="700" height="342" rx="12" fill="#fff"/><text x="28" y="34" class="label">A negative edge breaks early finalization</text><path class="edge" d="M 125 105 H 578"/><text x="350" y="91" text-anchor="middle" class="label">1</text><path class="edge" d="M 114 127 L 320 228"/><text x="196" y="190" class="label">4</text><path class="edge" d="M 370 228 L 589 127"/><text x="487" y="190" class="label" style="fill:#a73b3b">−6</text><circle cx="90" cy="105" r="32" class="box"/><text x="90" y="111" text-anchor="middle" class="label">A</text><circle cx="612" cy="105" r="32" class="box"/><text x="612" y="111" text-anchor="middle" class="label">B</text><circle cx="345" cy="245" r="32" class="box"/><text x="345" y="251" text-anchor="middle" class="label">C</text><text x="90" y="161" text-anchor="middle" class="note">source</text><text x="612" y="161" text-anchor="middle" class="note">target</text><text x="345" y="315" text-anchor="middle" class="label">A → C → B costs 4 − 6 = −2</text></svg>